plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daymark.app'
    compileSdk 35

    // Allow build output redirection in environments with restricted project folders.
    def altBuild = System.getenv('DAYMARK_BUILD_DIR')
    if (altBuild != null) {
        layout.buildDirectory = file(altBuild)
    }

    defaultConfig {
        applicationId 'com.daymark.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.1.0'
    }

    // Release signing is supplied at build time. Keystores and passwords are
    // never committed to this repository.
    def releaseKeystore = System.getenv('DAYMARK_KEYSTORE')
    def releaseStorePassword = System.getenv('DAYMARK_STORE_PASSWORD')
    def releaseKeyPassword = System.getenv('DAYMARK_KEY_PASSWORD')
    def releaseKeyAlias = System.getenv('DAYMARK_KEY_ALIAS') ?: 'daymark'
    def canSignRelease = releaseKeystore && releaseStorePassword && releaseKeyPassword

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
